name: TeleTube Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11.0
      uses: actions/setup-python@v4
      with:
        python-version: '3.11.0'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with flake8
      run: |
        pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

    - name: Test imports and basic functionality
      run: |
        python -c "
        import sys
        print(f'Python version: {sys.version}')
        
        # Test that our main modules can be imported
        try:
            import logging
            import os
            import sys
            from pathlib import Path
            print('✅ Standard library imports successful')
        except ImportError as e:
            print(f'❌ Standard library import failed: {e}')
            sys.exit(1)
            
        # Test third-party imports (without running the bot)
        try:
            from dotenv import load_dotenv
            from telegram import Update, InlineKeyboardButton, InlineKeyboardMarkup, ParseMode
            from telegram.ext import Updater, CommandHandler, MessageHandler, Filters, CallbackQueryHandler, CallbackContext
            from telegram.utils.request import Request
            from yt_dlp import YoutubeDL
            print('✅ Third-party imports successful')
        except ImportError as e:
            print(f'❌ Third-party import failed: {e}')
            sys.exit(1)
            
        print('✅ All tests passed!')
        "

    - name: Check Python version requirement
      run: |
        python -c "
        import sys
        if sys.version_info < (3, 11):
            print(f'❌ Python version check failed: {sys.version_info}')
            sys.exit(1)
        else:
            print(f'✅ Python version check passed: {sys.version_info}')
        "

    - name: Validate configuration files
      run: |
        # Check that .env.example exists and is valid
        if [ -f ".env.example" ]; then
          echo "✅ .env.example found"
        else
          echo "❌ .env.example not found"
          exit 1
        fi
        
        # Check that requirements.txt exists
        if [ -f "requirements.txt" ]; then
          echo "✅ requirements.txt found"
        else
          echo "❌ requirements.txt not found"
          exit 1
        fi
      shell: bash

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Security check with bandit
      run: |
        pip install bandit
        bandit -r . -f json -o bandit-report.json || true
        bandit -r . --severity-level medium --confidence-level medium

    - name: Check for secrets
      run: |
        # Check that no actual tokens are committed
        if grep -r "bot.*:.*" --include="*.py" --include="*.md" --include="*.txt" . | grep -v "your_bot_token_here" | grep -v "123456789:ABC"; then
          echo "❌ Potential bot token found in repository"
          exit 1
        else
          echo "✅ No bot tokens found in repository"
        fi
